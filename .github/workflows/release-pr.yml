# Opens/updates the release PR (version bumps + changelog). Publishing is release.yml.
name: Release PR

on:
  workflow_dispatch:

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    name: release-plz release-pr
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
